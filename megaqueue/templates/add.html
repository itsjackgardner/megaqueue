{% extends "base.html" %} {% block title_suffix %} — Add Download{% endblock %}
{% block content %}
<h1 class="text-xl font-bold mb-2">Add download</h1>
<p class="text-sm text-gray-400 mb-6">
  Paste one or more mega.nz links — one per line. Title, year, and media type
  are detected from the filenames; you only need to review if detection is
  ambiguous.
</p>
<form method="POST" action="/download" class="space-y-4">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

  <div>
    <label class="block text-sm text-gray-400 mb-1"
      >mega.nz links (one per line)</label
    >
    <textarea
      name="links"
      rows="6"
      required
      placeholder="https://mega.nz/file/..."
      class="w-full bg-gray-800 border border-gray-600 rounded px-3 py-2 text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 font-mono text-sm"
    ></textarea>
  </div>

  <button
    type="submit"
    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded"
  >
    Queue download
  </button>
</form>
{% endblock %}
