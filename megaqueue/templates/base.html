<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3B4CF6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="movie dog" />
    <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/static/manifest.json" />
    <link rel="apple-touch-icon" href="/static/icons/icon.svg" />
    <title>movie dog{% block title_suffix %}{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-900 text-gray-100 min-h-screen">
    <nav
      class="bg-gray-800 border-b border-gray-700 px-4 py-3 flex items-center justify-between"
    >
      <a href="/" class="text-xl font-bold text-white">movie dog</a>
      <div class="flex items-center gap-3">
        <a href="/logs" class="text-sm text-gray-400 hover:text-white">Logs</a>
        <a
          href="/download/add"
          class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded text-sm font-medium"
          >+ Add</a
        >
      </div>
    </nav>
    <main class="max-w-2xl mx-auto px-4 py-6">
      {% block content %}{% endblock %}
    </main>
    {% block scripts %}{% endblock %}
    <script src="/static/register-sw.js"></script>
  </body>
</html>
