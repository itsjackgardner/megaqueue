<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101420" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="movie dog" />
    <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/static/manifest.json" />
    <link rel="apple-touch-icon" href="/static/icons/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@700&display=swap" as="style" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet" /></noscript>
    <title>movie dog{% block title_suffix %}{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body class="bg-[#101420] text-[#C8CDD8] {% block body_class %}min-h-screen{% endblock %}">
    <nav
      class="bg-[#101420] border-b border-[#252A3C] px-5 py-4 flex items-center justify-between sticky top-0 z-50"
    >
      <a href="/" class="text-lg font-bold text-[#C8CDD8] font-display">movie dog</a>
      <div class="flex items-center gap-3">
        <a href="/logs" class="text-sm text-[#6E7790] hover:text-[#C8CDD8]">Logs</a>
        <a
          href="/download/add"
          class="bg-[#D4943C] hover:bg-[#C28535] text-[#101420] px-4 py-1.5 rounded-lg text-sm font-semibold font-display"
          >+ Add</a
        >
      </div>
    </nav>
    <main class="{% block main_class %}max-w-2xl mx-auto px-4{% endblock %} py-6 content-fade">
      {% with messages = get_flashed_messages() %}
      {% if messages %}
      {% for message in messages %}
      <div class="bg-[#1E3A5F]/50 border border-[#5BA4E6]/30 rounded-lg p-3 mb-4 text-sm text-[#5BA4E6]">{{ message }}</div>
      {% endfor %}
      {% endif %}
      {% endwith %}
      {% block content %}{% endblock %}
    </main>
    {% block scripts %}{% endblock %}
    <script src="/static/fonts.js"></script>
    <script src="/static/register-sw.js"></script>
  </body>
</html>
