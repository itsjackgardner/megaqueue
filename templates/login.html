{% extends "base.html" %}
{% block title_suffix %} — Login{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-20">
    <h1 class="text-2xl font-bold mb-6 text-center">Login</h1>
    <form method="POST" class="space-y-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        {% if error %}
        <div class="bg-red-900/50 border border-red-700 text-red-300 px-3 py-2 rounded text-sm">{{ error }}</div>
        {% endif %}
        <input type="password" name="password" placeholder="Password" required autofocus
               class="w-full bg-gray-800 border border-gray-600 rounded px-3 py-2 text-white placeholder-gray-500 focus:outline-none focus:border-blue-500">
        <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded">
            Sign In
        </button>
    </form>
</div>
{% endblock %}
